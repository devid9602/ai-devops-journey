# Reusable deploy job, called by deploy.yml once per environment.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and CDK environment name (dev or prod)
        required: true
        type: string

permissions:
  id-token: write # request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Protection rules (required reviewers for prod) are configured on this GitHub Environment.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3 # ARM64 image build on an x86 runner
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}
      - name: Deploy
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          EXTRA=""
          [ -n "$CERTIFICATE_ARN" ] && EXTRA="$EXTRA -c certificateArn=$CERTIFICATE_ARN"
          [ -n "$ALARM_EMAIL" ] && EXTRA="$EXTRA -c alarmEmail=$ALARM_EMAIL"
          npx cdk deploy --all -c env=${{ inputs.environment }} $EXTRA \
            --require-approval never --outputs-file cdk-outputs.json
      - name: Smoke test
        run: |
          URL=$(jq -r '."ecs-platform-${{ inputs.environment }}-service".ServiceUrl' cdk-outputs.json)
          echo "Testing $URL"
          # -k: with a custom-domain certificate the raw ALB hostname never matches; this only checks liveness.
          for i in $(seq 1 12); do
            if curl -fsSkL --max-time 5 "$URL/healthz"; then echo; exit 0; fi
            echo "attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "::error::Smoke test failed for $URL"; exit 1
