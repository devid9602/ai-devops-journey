name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Sample app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: app

  infra:
    name: CDK build, test and synth (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      # Synth never calls AWS (stacks are account-agnostic); these only set the target region.
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Commit package-lock.json after the first `npm install`, then this always uses `npm ci`.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Type-check
        run: npm run build
      - name: Assertion tests
        if: matrix.env == 'dev' # tests build both environments themselves
        run: npm test
      - name: Synthesize
        run: npx cdk synth -c env=${{ matrix.env }} --quiet
      - name: IaC misconfiguration scan (report-only until findings are triaged)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: cdk.out
          severity: HIGH,CRITICAL
          exit-code: '0'

  image:
    name: Build ARM64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
