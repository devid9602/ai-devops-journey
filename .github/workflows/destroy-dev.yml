name: Destroy dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to tear down the dev environment
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Destroy (dev only; prod has deletion protection and no destroy workflow)
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: npx cdk destroy --all -c env=dev --force
